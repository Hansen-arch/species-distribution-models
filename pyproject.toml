[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdm-benchmark"
version = "1.0.0"
description = "Species distribution model comparison across four algorithms on GBIF occurrences and WorldClim layers"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "rasterio>=1.3",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
boost = ["xgboost>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
