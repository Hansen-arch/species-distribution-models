# Environment for the SDM benchmark.
#
# The pipeline runs in the existing `geo` conda environment on this machine:
#   conda env update -n geo -f environment.yml --prune
# or create a dedicated one:
#   conda env create -f environment.yml
name: geo
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.26
  - pandas>=2.1
  - scikit-learn>=1.4
  - rasterio>=1.3
  - geopandas>=1.0
  - matplotlib>=3.8
  - requests>=2.31
  - tabulate>=0.9
  - pip
  - pip:
      - xgboost>=2.0
